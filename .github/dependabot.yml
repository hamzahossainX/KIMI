# Dependency updates. The dependency tree here is large (three.js, React Three
# Fiber, framer-motion), so npm supply chain drift is the main realistic risk
# for a static site with no backend. Minor and patch updates are grouped into a
# single pull request to keep the review load reasonable; majors arrive
# individually because they need a real look.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        update-types:
          - minor
          - patch
