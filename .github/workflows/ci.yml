# Quality gate for pull requests and pushes to main.
#
# Scope note: this repository has no test suite and no committed ESLint
# configuration, so CI verifies exactly what can be verified — that the
# dependency tree installs from the lockfile, that the TypeScript project
# typechecks under `strict`, and that a production build succeeds on each
# Node.js major in the matrix below.
#
# `package.json` declares no `engines` range, so that matrix is the only
# statement this repository makes about Node.js support. Its floor is 18,
# the oldest major `next@14.2.3` accepts (`>=18.17.0`); 18 and 20 are past
# upstream end-of-life and are tested as compatibility floors, not as
# recommended runtimes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
